providers = ["python"]

[phases.setup]
nixPkgs = ["postgresql"]

[phases.install]
paths = ["/opt/venv/bin"]
cmds = [
  "python -m venv --copies /opt/venv",
  ". /opt/venv/bin/activate && pip install --upgrade pip",
  ". /opt/venv/bin/activate && pip install --no-cache-dir -r requirements.txt"
]

[phases.build]
paths = ["/opt/venv/bin"]
cmds = [
  ". /opt/venv/bin/activate && python manage.py collectstatic --noinput"
]

[start]
cmd = ". /opt/venv/bin/activate && python server.py"
